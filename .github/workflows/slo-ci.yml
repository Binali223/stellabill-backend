name: SLO Verification

on:
  push:
    branches:
      - main
    paths:
      - 'deploy/slos/**'
      - 'tools/slo-lint/**'
      - '.github/workflows/slo-ci.yml'
  pull_request:
    paths:
      - 'deploy/slos/**'
      - 'tools/slo-lint/**'
      - '.github/workflows/slo-ci.yml'

jobs:
  slo-verify:
    name: Verify SLOs
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run slo-lint tests
        run: go test ./tools/slo-lint/... -cover

      - name: Build slo-lint
        run: go build -o slo-lint ./tools/slo-lint

      - name: Render Prometheus rules
        run: ./slo-lint deploy/slos/*.yaml > deploy/slos/generated_rules.yml
