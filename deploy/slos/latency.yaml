name: API_Latency
objective: 99.0
description: "99% of API requests must complete in under 200ms."
labels:
  service: stellabill-api
numerator: 'sum(rate(http_request_duration_seconds_bucket{le="0.2"}[{{.window}}]))'
denominator: 'sum(rate(http_request_duration_seconds_count[{{.window}}]))'
windows:
  - fast: "1h"
    slow: "6h"
  - fast: "5m"
    slow: "30m"
